name: Build Signed IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISION_BASE64" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/studyplayer.mobileprovision"
          # 从描述文件里读出 team id / bundle id，写进 build settings
          /usr/libexec/PlistBuddy -c "Print" /dev/stdin <<< "$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/studyplayer.mobileprovision")" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || \
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/studyplayer.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamID" "$RUNNER_TEMP/profile.plist")
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$(/usr/libexec/PlistBuddy -c 'Print :TeamName' "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"

      - name: Build archive
        run: |
          xcodebuild -project StudyPlayer.xcodeproj \
            -scheme StudyPlayer \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/StudyPlayer.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            clean archive

      - name: Export IPA
        env:
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISION_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.peilongtang.studyplayer</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudyPlayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlayer-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 90
