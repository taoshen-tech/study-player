name: Diagnose XcodeGen

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test 1 - minimal spec
        run: |
          mkdir -p /tmp/t1/Sources && echo 'import UIKit' > /tmp/t1/Sources/A.swift
          cd /tmp/t1
          cat > project.yml <<'YML'
          name: T1
          options:
            bundleIdPrefix: com.test
          targets:
            T1:
              type: application
              platform: iOS
              sources:
                - path: Sources
          YML
          xcodegen generate 2>&1 | tail -3

      - name: Test 2 - with settings group
        run: |
          mkdir -p /tmp/t2/Sources && echo 'import UIKit' > /tmp/t2/Sources/A.swift
          cd /tmp/t2
          cat > project.yml <<'YML'
          name: T2
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: "15.0"
            xcodeVersion: "15"
            generateEmptyDirectories: true
          settingGroups:
            common:
              buildSettings:
                SWIFT_VERSION: "5.9"
                TARGETED_DEVICE_FAMILY: "1,2"
                SUPPORTED_PLATFORMS: iphoneos iphonesimulator
                IPHONEOS_DEPLOYMENT_TARGET: "15.0"
                CODE_SIGN_STYLE: Manual
                ENABLE_BITCODE: NO
                CLANG_ENABLE_MODULES: YES
          targets:
            T2:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              settings:
                group: common
              sources:
                - path: Sources
          YML
          xcodegen generate 2>&1 | tail -3

      - name: Test 3 - with info properties
        run: |
          mkdir -p /tmp/t3/Sources && echo 'import UIKit' > /tmp/t3/Sources/A.swift
          cd /tmp/t3
          cat > project.yml <<'YML'
          name: T3
          options:
            bundleIdPrefix: com.test
          targets:
            T3:
              type: application
              platform: iOS
              sources:
                - path: Sources
              info:
                properties:
                  CFBundleDisplayName: 刷题课堂
                  CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              buildSettings:
                PRODUCT_BUNDLE_IDENTIFIER: "com.test.t3"
          YML
          xcodegen generate 2>&1 | tail -3

      - name: Test 4 - actual repo spec
        run: |
          cd "$GITHUB_WORKSPACE"
          xcodegen generate 2>&1 | tail -5 || true
