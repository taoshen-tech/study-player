name: Diagnose 2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen

      - name: A - strings only
        run: |
          mkdir -p /tmp/a/Sources && echo x > /tmp/a/Sources/A.swift
          cd /tmp/a
          cat > project.yml <<'YML'
          name: A
          targets:
            A:
              type: application
              platform: iOS
              sources: [Sources]
              info:
                properties:
                  CFBundleDisplayName: App
                  CFBundleVersion: "1"
          YML
          xcodegen generate 2>&1 | tail -2

      - name: B - empty dict UILaunchScreen
        run: |
          mkdir -p /tmp/b/Sources && echo x > /tmp/b/Sources/A.swift
          cd /tmp/b
          cat > project.yml <<'YML'
          name: B
          targets:
            B:
              type: application
              platform: iOS
              sources: [Sources]
              info:
                properties:
                  UILaunchScreen: {}
          YML
          xcodegen generate 2>&1 | tail -2

      - name: C - nested dict NSAppTransportSecurity
        run: |
          mkdir -p /tmp/c/Sources && echo x > /tmp/c/Sources/A.swift
          cd /tmp/c
          cat > project.yml <<'YML'
          name: C
          targets:
            C:
              type: application
              platform: iOS
              sources: [Sources]
              info:
                properties:
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
          YML
          xcodegen generate 2>&1 | tail -2

      - name: D - array value
        run: |
          mkdir -p /tmp/d/Sources && echo x > /tmp/d/Sources/A.swift
          cd /tmp/d
          cat > project.yml <<'YML'
          name: D
          targets:
            D:
              type: application
              platform: iOS
              sources: [Sources]
              info:
                properties:
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
          YML
          xcodegen generate 2>&1 | tail -2

      - name: E - real spec
        run: |
          xcodegen generate --spec project.yml 2>&1 | tail -3 || true
