name: StudyPlayer
options:
  bundleIdPrefix: com.peilongtang
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"

settingGroups:
  common:
    buildSettings:
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTED_PLATFORMS: iphoneos iphonesimulator
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      ENABLE_BITCODE: NO
      CLANG_ENABLE_MODULES: YES
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Support/Info.plist

targets:
  StudyPlayer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      group: common
    sources:
      - path: Sources
      - path: Support
        buildPhase: none
    buildSettings:
      PRODUCT_BUNDLE_IDENTIFIER: "com.peilongtang.studyplayer"
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
